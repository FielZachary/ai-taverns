services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_taverns
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ai_taverns_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_taverns"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai_taverns_postgres_data:
