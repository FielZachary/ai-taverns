  .subtitle{font-size:13px;font-style:italic;fill:#6B4423;}
  .region{font-size:16px;font-weight:700;font-style:italic;fill:#5C3A21;letter-spacing:0.5px;}
  .capital{font-size:12px;font-weight:700;fill:#2E1D10;}
  .settle{font-size:10.5px;fill:#3A2414;}
  .legend{font-size:10.5px;fill:#4A2E1A;}
  .legendTitle{font-size:11px;font-weight:700;fill:#4A2E1A;}
</style>

