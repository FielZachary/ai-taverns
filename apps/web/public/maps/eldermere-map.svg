<svg width="680" height="900" viewBox="0 0 680 900" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Map of Eldermere</title>
<desc>A fantasy map of Eldermere showing its seven realms: Cael Ambrose, the Ashfell Marches, the Ferrant Concord, Thornwake Vale, the Salt Concordat, the Veiled Reach, and the Sundered Vale, with the Cinderspine mountains, Thornwake Vale's forest, the Amberflow and Sern rivers, key settlements, a compass rose and legend.</desc>
<defs>
  <g id="mtn">
    <polygon points="0,22 11,0 22,22" fill="#8B7355" stroke="#5C4A38" stroke-width="0.8"/>
    <polygon points="7,8 11,0 15,8" fill="#F2EDE2"/>
  </g>
  <g id="tree">
    <polygon points="8,0 15,13 1,13" fill="#3E6B35" stroke="#2A4A24" stroke-width="0.5"/>
    <polygon points="8,6 16,18 0,18" fill="#4A7A3F" stroke="#2A4A24" stroke-width="0.5"/>
    <rect x="6.5" y="17" width="3" height="6" fill="#5C4A38"/>
  </g>
</defs>
