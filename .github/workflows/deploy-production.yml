name: Deploy production

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH || '/opt/ai-taverns' }}
  PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN || 'https://aitaverns.com' }}
  SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
  SSH_USER: ${{ secrets.PRODUCTION_SSH_USER || 'root' }}

jobs:
  deploy:
    name: Build, ship, and restart production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Measure coverage
        run: npm run coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: production-coverage-reports
          path: |
            apps/*/coverage/
            packages/*/coverage/
          if-no-files-found: error

      - name: Check coverage thresholds
        run: npm run coverage:check -- --enforce

      - name: Build API
        run: npm run build:api

      - name: Build web
        run: npm run build -w @ai-dnd/web

      - name: Package deployment archive
        run: git archive --format=tar.gz --output="/tmp/ai-taverns-${GITHUB_SHA}.tar.gz" HEAD

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/production_deploy_key
          chmod 600 ~/.ssh/production_deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.PRODUCTION_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload deployment archive
        run: |
          set -euo pipefail
          scp -i ~/.ssh/production_deploy_key -P "$SSH_PORT" \
            "/tmp/ai-taverns-${GITHUB_SHA}.tar.gz" \
            "$SSH_USER@${{ secrets.PRODUCTION_SSH_HOST }}:/tmp/ai-taverns-${GITHUB_SHA}.tar.gz"

      - name: Rebuild production stack
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/production_deploy_key -p "$SSH_PORT" "$SSH_USER@${{ secrets.PRODUCTION_SSH_HOST }}" \
            "SHA='$GITHUB_SHA' DEPLOY_PATH='$DEPLOY_PATH' PRODUCTION_ORIGIN='$PRODUCTION_ORIGIN' bash -s" <<'REMOTE'
          set -euo pipefail

          archive="/tmp/ai-taverns-${SHA}.tar.gz"
          release="/tmp/ai-taverns-release-${SHA}"
          compose="docker compose --env-file infra/production.env -f infra/docker-compose.production.yml"

          rm -rf "$release"
          mkdir -p "$release"
          tar -xzf "$archive" -C "$release"

          if [ ! -f "$DEPLOY_PATH/infra/production.env" ]; then
            echo "Missing $DEPLOY_PATH/infra/production.env; refusing to deploy." >&2
            exit 1
          fi

          mkdir -p "$DEPLOY_PATH/infra"
          find "$DEPLOY_PATH" -mindepth 1 -maxdepth 1 ! -name infra ! -name .git -exec rm -rf -- {} +
          find "$DEPLOY_PATH/infra" -mindepth 1 -maxdepth 1 ! -name production.env ! -name backups -exec rm -rf -- {} +
          cp -a "$release"/. "$DEPLOY_PATH"/

          cd "$DEPLOY_PATH"
          $compose up -d --build --remove-orphans
          ready=0
          for attempt in $(seq 1 60); do
            ready=1
            for service in postgres api web proxy; do
              container_id="$($compose ps -q "$service")"
              if [ -z "$container_id" ]; then
                ready=0
                continue
              fi
              status="$(docker inspect --format '{{ if .State.Health }}{{ .State.Health.Status }}{{ else }}{{ .State.Status }}{{ end }}' "$container_id")"
              if [ "$status" != "healthy" ]; then
                ready=0
              fi
            done
            if [ "$ready" -eq 1 ]; then
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            $compose ps
            echo "Production services did not become healthy in time." >&2
            exit 1
          fi
          $compose ps
          COMPOSE_PROJECT_DIR="$DEPLOY_PATH" PRODUCTION_ORIGIN="$PRODUCTION_ORIGIN" ./scripts/check-production-monitoring.sh

          rm -rf "$release" "$archive"
          REMOTE

      - name: Verify public production health
        run: scripts/check-production-health.sh "$PRODUCTION_ORIGIN"
