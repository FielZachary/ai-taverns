name: CI

on:
  pull_request:
    branches:
      - development
      - production
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-gate:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_taverns_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_taverns_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ai_taverns_test
      DATABASE_SSL_DISABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Guard production PR deploy triggers
        if: github.event_name == 'pull_request' && github.base_ref == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          pr_text="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json title,body --jq '[.title, (.body // "")] | join("\n")')"

          if printf '%s\n' "$pr_text" | grep -Eiq '\[(skip ci|ci skip|no ci|skip actions|actions skip)\]|skip-checks:[[:space:]]*true'; then
            echo "Production PR title/body contains a GitHub Actions skip directive." >&2
            echo "That would prevent the production push from running the deploy workflow after merge." >&2
            echo "Use a clean production promotion title and body." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Measure coverage
        run: npm run coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/*/coverage/
            packages/*/coverage/
          if-no-files-found: error

      - name: Check coverage thresholds
        run: npm run coverage:check -- --enforce

      - name: Build API
        run: npm run build:api

      - name: Build web
        run: npm run build -w @ai-dnd/web
